name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    uses: ./.github/workflows/reusable-codeql.yml
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    with:
      # "actions" also scans this repository's own workflows for security problems.
      languages: '["csharp", "javascript-typescript", "actions"]'
