name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    uses: ./.github/workflows/reusable-docs-site.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      # Set the PAGES_ENABLED repository variable once Pages uses GitHub Actions.
      deploy: ${{ github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true' }}
