name: Reusable / Scheduled scan

# Scans published images on a schedule, because new vulnerabilities appear after
# an image was built. Keeps one issue per image up to date, and closes it when
# the image is clean. A scan that cannot run fails the job.
#
# Usage:
#   on:
#     schedule:
#       - cron: "23 3 * * *"
#   jobs:
#     scan:
#       uses: Megjafari/platform-pipelines/.github/workflows/reusable-scheduled-scan.yml@v1
#       permissions:
#         contents: read
#         issues: write
#         packages: read
#       with:
#         images: |
#           ghcr.io/owner/app:prod
#           ghcr.io/owner/worker:prod

on:
  workflow_call:
    inputs:
      images:
        description: Image references to scan, one per line
        type: string
        required: true
      severity:
        description: Severities to report
        type: string
        default: CRITICAL,HIGH
      ignore-unfixed:
        description: Ignore vulnerabilities without an available fix
        type: boolean
        default: true
      open-issues:
        description: Open, update and close issues (otherwise results only go to the job summary)
        type: boolean
        default: true
      fail-on-findings:
        description: Fail the job when an image has findings
        type: boolean
        default: false
      issue-label:
        type: string
        default: vulnerability-scan
      trivy-version:
        type: string
        default: "0.76.2"

permissions:
  contents: read

jobs:
  scan:
    name: scan images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TRIVY_SCANNERS: vuln
      TRIVY_SEVERITY: ${{ inputs.severity }}
      TRIVY_IGNORE_UNFIXED: ${{ inputs.ignore-unfixed }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install Trivy (checksum verified)
        env:
          VERSION: ${{ inputs.trivy-version }}
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/aquasecurity/trivy/releases/download/v${VERSION}"
          archive="trivy_${VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/trivy_${VERSION}_checksums.txt"
          grep " ${archive}\$" "trivy_${VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${archive}" trivy

      - name: Prepare issue label
        if: inputs.open-issues
        env:
          LABEL: ${{ inputs.issue-label }}
        run: gh label create "$LABEL" --force --color d73a4a --description "Found by a scheduled image scan"

      - name: Scan images
        env:
          IMAGES: ${{ inputs.images }}
          LABEL: ${{ inputs.issue-label }}
          OPEN_ISSUES: ${{ inputs.open-issues }}
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          FOUND=42 # a custom exit code separates findings from a scan that failed
          report="$RUNNER_TEMP/report.json"
          body="$RUNNER_TEMP/body.md"
          failed=0
          findings=0

          issue_for() {
            gh issue list --state open --label "$LABEL" --limit 200 --json number,title |
              jq -r --arg title "$1" '.[] | select(.title == $title) | .number'
          }

          while IFS= read -r image; do
            image=$(echo "$image" | xargs)
            [ -n "$image" ] || continue
            title="Vulnerabilities in $image"

            code=0
            "$RUNNER_TEMP/trivy" image --quiet --format json --output "$report" --exit-code "$FOUND" "$image" || code=$?

            if [ "$code" -eq 0 ]; then
              echo "- \`$image\`: clean" >> "$GITHUB_STEP_SUMMARY"
              if [ "$OPEN_ISSUES" = "true" ]; then
                number=$(issue_for "$title")
                if [ -n "$number" ]; then
                  gh issue close "$number" --comment "The latest [scan]($RUN_URL) found nothing, so this is resolved."
                fi
              fi
            elif [ "$code" -eq "$FOUND" ]; then
              findings=1
              rows=$(jq -r '
                [.Results[]? | .Vulnerabilities[]?
                  | [.VulnerabilityID, .PkgName, .InstalledVersion, .FixedVersion, .Severity]]
                | unique | sort_by(.[4], .[0])
                | .[] | "| " + (map(. // "" | tostring) | join(" | ")) + " |"' "$report")
              count=$(grep -c . <<< "$rows")
              {
                echo "The [scheduled scan]($RUN_URL) found $count vulnerabilities in \`$image\`."
                echo "Rebuild the image to pick up fixes (with \`no-cache: true\` if the fix is newer than today's build cache), then promote the new digest."
                echo
                echo "| Vulnerability | Package | Installed | Fixed in | Severity |"
                echo "| --- | --- | --- | --- | --- |"
                head -n 200 <<< "$rows"
                if [ "$count" -gt 200 ]; then echo; echo "Only the first 200 are shown."; fi
              } > "$body"
              echo "- \`$image\`: $count vulnerabilities" >> "$GITHUB_STEP_SUMMARY"
              if [ "$OPEN_ISSUES" = "true" ]; then
                number=$(issue_for "$title")
                if [ -n "$number" ]; then
                  gh issue edit "$number" --body-file "$body"
                else
                  gh issue create --title "$title" --label "$LABEL" --body-file "$body"
                fi
              fi
            else
              failed=1
              echo "::error::Scanning $image failed with exit code $code"
              echo "- \`$image\`: scan failed" >> "$GITHUB_STEP_SUMMARY"
            fi
          done <<< "$IMAGES"

          if [ "$failed" -eq 1 ]; then exit 1; fi
          if [ "$findings" -eq 1 ] && [ "$FAIL_ON_FINDINGS" = "true" ]; then
            echo "::error::Vulnerabilities were found"
            exit 1
          fi
