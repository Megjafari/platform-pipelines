name: Reusable / Container promote

# Promotes an image that is already built by adding a tag to its digest, so that
# what was tested is exactly what moves on. Refuses images that were not signed
# by reusable-container, and confirms the digest afterwards. Nothing is rebuilt.
#
# Usage:
#   jobs:
#     promote:
#       uses: Megjafari/platform-pipelines/.github/workflows/reusable-container-promote.yml@v1
#       permissions:
#         contents: read
#         packages: write
#       with:
#         image: ghcr.io/owner/app
#         digest: sha256:0123...
#         target-tag: prod
#         environment: prod

on:
  workflow_call:
    inputs:
      image:
        description: Image name without tag or digest
        type: string
        required: true
      digest:
        description: Digest to promote (sha256:...)
        type: string
        required: true
      target-tag:
        description: Tag to add, such as staging or prod
        type: string
        required: true
      environment:
        description: GitHub environment for the job, for example to require manual approval
        type: string
        default: ""
      signed-by-repository:
        description: Repository that must have signed the image (defaults to the calling repository)
        type: string
        default: ""
      crane-version:
        type: string
        default: "0.22.1"

permissions:
  contents: read

jobs:
  promote:
    name: verify and promote
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ inputs.image }}
      DIGEST: ${{ inputs.digest }}
      TARGET_TAG: ${{ inputs.target-tag }}
      SIGNED_BY: ${{ inputs.signed-by-repository }}
    steps:
      - name: Validate inputs
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::digest must look like sha256:<64 hex characters>"
            exit 1
          fi
          if [[ ! "$TARGET_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::target-tag is not a valid image tag"
            exit 1
          fi
          echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
          echo "SIGNED_BY=${SIGNED_BY:-$GITHUB_REPOSITORY}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Verify signature
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/.+/\.github/workflows/reusable-container\.yml@' \
            --certificate-github-workflow-repository "$SIGNED_BY"

      - name: Install crane (checksum verified)
        env:
          VERSION: ${{ inputs.crane-version }}
        run: |
          cd "$RUNNER_TEMP"
          archive=go-containerregistry_Linux_x86_64.tar.gz
          base="https://github.com/google/go-containerregistry/releases/download/v${VERSION}"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "${archive}" crane

      - name: Add tag to the digest
        run: '"$RUNNER_TEMP/crane" tag "${IMAGE}@${DIGEST}" "$TARGET_TAG"'

      - name: Confirm the tag points at the digest
        run: |
          actual=$("$RUNNER_TEMP/crane" digest "${IMAGE}:${TARGET_TAG}")
          if [ "$actual" != "$DIGEST" ]; then
            echo "::error::${IMAGE}:${TARGET_TAG} is ${actual}, expected ${DIGEST}"
            exit 1
          fi
          echo "Promoted ${IMAGE}@${DIGEST} to ${TARGET_TAG}" >> "$GITHUB_STEP_SUMMARY"
